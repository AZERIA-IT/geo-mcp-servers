name: Add a geospatial MCP server
description: Suggest a new server for the list
title: "[server] <name>"
labels: ["new-server"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Example Geo MCP
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Source URL (GitHub repo preferred)
      placeholder: https://github.com/someone/example-geo-mcp
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      placeholder: Geocodes addresses via the XYZ API
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Geocoding & place search
        - Routing, isochrones & navigation
        - Maps, tiles & visualization
        - Spatial databases (PostGIS, DuckDB, etc.)
        - Remote sensing, STAC & earth observation
        - Weather & climate
        - Desktop GIS (QGIS, ArcGIS, GRASS)
        - General GIS / geoprocessing toolkits
        - Geospatial data access & catalogs
        - Parcels & property
        - Aviation & maritime tracking (ADS-B, AIS)
        - Other / misc
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: Author / org
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Python
  - type: checkboxes
    id: official
    attributes:
      label: Official?
      options:
        - label: This is an official / vendor-published server
